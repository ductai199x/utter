[project]
name = "utter-tts-kokoro"
version = "0.0.0"
description = "Kokoro-82M (Apache-2.0) speech synthesis for utter-data (envs/tts/speak.py). Dev only, never shipped."
requires-python = ">=3.12,<3.13"
dependencies = [
    "kokoro>=0.9.4",
    "misaki[en]>=0.9.4",
    # misaki loads this spaCy model and pip-installs it at run time if missing; pinned here instead.
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "soundfile>=0.12",
    "soxr>=0.5",
    "torch>=2.8",
]

# Its own environment: TTS engines pin their own torch and transformers, which must not
# constrain the eval tools' environment (tools/pyproject.toml).
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[tool.uv]
package = false
