[project]
name = "utter-litert"
version = "0.0.0"
description = "Exports Utter's speech encoder to LiteRT for Android's GPU (utter-speech export-litert). Dev only, never shipped."
requires-python = ">=3.12,<3.13"
dependencies = [
    # LiteRT's converter ships for Linux and macOS only: on Windows this runs in WSL.
    "litert-torch>=0.9.4",
    "ai-edge-quantizer>=0.9.0",
    "torch>=2.13",
    "transformers>=5.20",
    "numpy>=2",
    "typer>=0.12",
]

# Its own environment: the converter pins its own TensorFlow and JAX stack. The conversion runs
# on the CPU.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.uv]
package = false
