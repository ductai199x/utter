[project]
name = "utter-tools"
version = "0.0.0"
description = "Utter's offline tooling: eval sets, scoring, reference transcriptions. Never shipped."
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub>=1.0",
    "pyarrow>=17",
    "soundfile>=0.12",
    "soxr>=0.5",
    "numpy>=2.0",
    "jiwer>=4.0",
    "typer>=0.12",
    "rich>=13.7",
]

[dependency-groups]
dev = ["ruff>=0.6", "pyright>=1.1.380", "pytest>=8.3"]
# onnxruntime-gpu with the CUDA 13 / cuDNN 9 DLLs from the nvidia-* wheels, for the Python
# side only: the eval candidates, the export checks, onnx-asr. The Rust core never loads from
# this environment; it runs on its own pinned components (crates/utter-runtime).
runtime = [
    "onnxruntime-gpu>=1.27",
    "nvidia-cudnn-cu13>=9.0",
    "nvidia-cublas>=13.0",
    "nvidia-cuda-runtime>=13.0",
    "nvidia-cuda-nvrtc>=13.0",
    "nvidia-cufft>=12.0",
    "nvidia-curand>=10.0",
    "onnx-asr[hub]>=0.12",
]

# The speech models' official runtimes, for the accuracy bench (docs/model-survey.md).
models = [
    "torch>=2.14",
    "transformers>=5.19",
    "accelerate>=1.15",
    "librosa>=1.0",
    "sentencepiece>=0.2",
    "protobuf>=5",
    # moondream/parakeet-ultra runs only in its own engine (Photon, from the kestrel package).
    "moondream>=2.6",
    # Exporting models to the ONNX graphs the Rust core runs (tools/export).
    "onnx>=1.23",
    # onnxruntime's weight-only quantizer (MatMulNBits) needs it.
    "onnx-ir>=0.1",
]

[tool.uv]
default-groups = ["dev", "runtime", "models"]
# onnx-asr depends on the CPU-only `onnxruntime`, which would shadow onnxruntime-gpu (same
# import name). The GPU build provides the CPU provider too.
override-dependencies = ["onnxruntime ; sys_platform == 'never'"]
# Resolve only versions that ship wheels for the platforms we develop on: some nvidia-* releases
# are Linux-only.
required-environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

# PyTorch's CUDA 13.0 build, from PyTorch's own index; everything else from PyPI.
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.flake8-bugbear]
# Typer declares CLI parameters as call defaults by design.
extend-immutable-calls = ["typer.Argument", "typer.Option"]
