[project]
name = "utter-tts-chatterbox"
version = "0.0.0"
description = "Chatterbox (MIT, Resemble AI) speech synthesis for Utter's eval and training sets: voice cloning for speaker variety. Dev only, never shipped."
requires-python = ">=3.12,<3.13"
dependencies = [
    "chatterbox-tts==0.1.7",
    # Direct, so the CUDA index below applies (uv sources only govern direct dependencies).
    "torch==2.6.0",
    "torchaudio==2.6.0",
    # resemble-perth (the watermarker) imports pkg_resources, which setuptools 81+ removed.
    "setuptools<81",
    # The Linux torch wheel loads CUDA from these packages (its own Requires-Dist), but uv locks
    # the Windows wheel's metadata, which has none, for every platform. Listed so Linux works
    # (e.g. FLAME); versions are torch 2.6.0+cu126's.
    "nvidia-cuda-nvrtc-cu12==12.6.77; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "nvidia-cuda-runtime-cu12==12.6.77; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "nvidia-cuda-cupti-cu12==12.6.80; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "nvidia-cudnn-cu12==9.5.1.17; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "nvidia-cublas-cu12==12.6.4.1; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "nvidia-cufft-cu12==11.3.0.4; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "nvidia-curand-cu12==10.3.7.77; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "nvidia-cusolver-cu12==11.7.1.2; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "nvidia-cusparse-cu12==12.5.4.2; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "nvidia-cusparselt-cu12==0.6.3; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "nvidia-nccl-cu12==2.21.5; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "nvidia-nvtx-cu12==12.6.77; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "nvidia-nvjitlink-cu12==12.6.85; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "triton==3.2.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "soundfile>=0.12",
    "soxr>=0.5",
    "typer>=0.12",
]

# Chatterbox pins torch 2.6.0, so it has its own environment, kept on C: (docs/local-setup.md).
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchaudio = { index = "pytorch-cu126" }

[tool.uv]
package = false
