[project]
name = "utter-train"
version = "0.0.0"
description = "Fine-tuning Utter's cleanup model (LoRA on Gemma 4 E4B QAT). Dev only, never shipped."
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.8",
    "transformers>=5.17",
    "peft>=0.20",
    "accelerate>=1.13",
    "safetensors>=0.6",
    # Writes the merged model as GGUF for llama.cpp (the same converter llama.cpp ships).
    "gguf>=0.19",
    "sentencepiece>=0.2",
    "protobuf>=5",
    "typer>=0.12",
]

# Its own environment, kept on C: (docs/local-setup.md): training pins its own PyTorch and
# Transformers and must not constrain the eval tools.
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[tool.uv]
package = false
