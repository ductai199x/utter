# Every push and pull request: the whole workspace, the app included, on the three desktops
# Utter runs on. macOS is checked here first: no Mac runs it yet.
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TERM_COLOR: always
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4

      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Linux libraries (WebKitGTK, the tray, ALSA)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev

      # The app's pages are built into the binary: they must exist before it compiles.
      - name: Pages
        working-directory: app
        run: |
          npm ci
          npm run check
          npm run build

      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets

      - name: Tests
        run: cargo test --workspace

      # The app bundle builds, ad-hoc signed, with the keys macOS needs merged into its
      # Info.plist (no microphone description: macOS refuses the microphone). Not uploaded.
      - name: macOS app bundle
        if: runner.os == 'macOS'
        working-directory: app
        env:
          RUSTFLAGS: ""
        run: |
          npx tauri build --bundles app
          plist=../target/release/bundle/macos/Utter.app/Contents/Info.plist
          plutil -extract NSMicrophoneUsageDescription raw "$plist"
          plutil -extract LSUIElement raw "$plist"
          codesign -dv ../target/release/bundle/macos/Utter.app 2>&1 | grep -E "Signature|Identifier"
