[package]
name = "utter-app"
description = "Utter: local voice dictation"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[[bin]]
name = "utter"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
utter-core.workspace = true
utter-platform.workspace = true
utter-pipeline.workspace = true
utter-audio.workspace = true
utter-llm.workspace = true
utter-runtime.workspace = true
utter-asr.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tauri = { version = "2.12.2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2.5.2"
