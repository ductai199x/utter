[package]
name = "utter-app"
description = "Utter: local voice dictation"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[[bin]]
name = "utter"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
utter-core.workspace = true
utter-platform.workspace = true
utter-pipeline.workspace = true
utter-audio.workspace = true
utter-llm.workspace = true
utter-runtime.workspace = true
utter-asr.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# macos-private-api: the Bar's transparent window on macOS (no effect elsewhere; tauri-build
# reads the features from this line, not from a target section).
tauri = { version = "2.12.2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-single-instance = "2.5.2"

# The Bar's window type on Linux (main.rs, Bar::new).
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18.2"
