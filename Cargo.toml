[workspace]
resolver = "3"
members = ["crates/utter-core", "crates/utter-platform", "crates/utter-runtime", "crates/utter-audio", "crates/utter-asr", "crates/utter-llm", "crates/utter-pipeline", "crates/utter-cli", "app/src-tauri"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"
authors = ["Tai Duc Nguyen"]
rust-version = "1.98"

[workspace.dependencies]
utter-core = { path = "crates/utter-core" }
utter-platform = { path = "crates/utter-platform" }
utter-runtime = { path = "crates/utter-runtime" }
utter-audio = { path = "crates/utter-audio" }
utter-asr = { path = "crates/utter-asr" }
utter-llm = { path = "crates/utter-llm" }
utter-pipeline = { path = "crates/utter-pipeline" }

anyhow = "1.0.104"
cpal = "0.18.2"
clap = { version = "4.6.7", features = ["derive"] }
globset = "0.4.20"
hex = "0.4.3"
hound = "3.5.1"
# onnxruntime is loaded at run time (load-dynamic) from the pinned component utter-runtime
# installs (crates/utter-runtime/components.json).
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "tracing", "load-dynamic", "cuda"] }
sha2 = "0.11.0"
windows-sys = "0.61.2"
ureq = { version = "3.4.2", features = ["json"] }
zip = { version = "9.0.0", default-features = false, features = ["deflate"] }
ndarray = "0.17.2"
realfft = "3.5.0"
ringbuf = "0.5.3"
rubato = "5.0.1"
audioadapter-buffers = "5.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
toml = "1.1.8"
toml_edit = "0.25.17"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
debug = "line-tables-only"
